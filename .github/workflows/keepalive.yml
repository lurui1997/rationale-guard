name: keepalive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the live health endpoint
        run: |
          if [ -z "${{ vars.RATIONALE_PUBLIC_URL }}" ]; then
            echo "Set repository variable RATIONALE_PUBLIC_URL to enable keepalive."
            exit 0
          fi
          curl --fail --show-error --silent "${{ vars.RATIONALE_PUBLIC_URL }}/api/health"
