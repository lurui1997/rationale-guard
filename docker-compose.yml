services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      FALKORDB_URL: redis://falkordb:6379
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    env_file:
      - path: .env
        required: false
    depends_on:
      - falkordb
volumes:
  falkordb-data: {}
