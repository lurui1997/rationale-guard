[project]
name = "rationale-guard"
version = "0.1.0"
description = "Decision guard for coding agents, backed by a FalkorDB rationale graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "falkordb>=1.0.0",
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rationale-guard = "rationale.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rationale*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
